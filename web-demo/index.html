<title>모의투자 리그</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#FBF7F0; --card:#FFFFFF; --ink:#211A2E; --muted:#5C5548;
    --point:#F2A93B; --up:#C13B3B; --down:#3457B2; --tag:#EFEAE0;
    --line:rgba(33,26,46,0.08); --warn-bg:#FDEEE8; --warn-line:rgba(193,59,59,0.35);
    --display:'Black Han Sans','Noto Sans KR',sans-serif;
    --body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  *{box-sizing:border-box}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
  input{font-family:inherit}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px 96px;min-height:100%}
  .wrap.detail{padding-bottom:340px}
  .wrap.plain{padding-bottom:40px}
  .display{font-family:var(--display);font-weight:400;letter-spacing:-0.01em}
  .muted{color:var(--muted)}
  .up{color:var(--up)} .down{color:var(--down)}
  .num{font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .col{display:flex;flex-direction:column}
  .card{background:var(--card);border-radius:16px;padding:15px}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
  .title{font-family:var(--display);font-size:19px}
  .pill{background:var(--ink);color:var(--bg);border-radius:20px;padding:5px 11px;
        display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
  .ticker{display:flex;gap:16px;font-size:12px;color:var(--muted);padding-bottom:10px;flex-wrap:wrap}
  .ticker b{color:var(--ink)}

  .banner{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);
          border:1px solid var(--warn-line);border-radius:12px;padding:9px 12px;margin-bottom:10px;
          width:100%;text-align:left}
  .banner .t{font-size:12px;font-weight:700;color:var(--up)}
  .banner .s{font-size:11px;color:var(--muted)}

  .asset{background:var(--card);border-radius:20px;padding:22px;
         box-shadow:0 2px 14px rgba(33,26,46,0.07)}
  .asset .lab{font-size:13px;color:var(--muted)}
  .asset .big{font-family:var(--display);font-size:32px;line-height:1.2;margin-top:2px}
  .asset .chg{font-size:13px;font-weight:700;margin-top:2px}
  .asset .sub{font-size:12px;color:var(--muted);margin-top:8px}
  .asset .cash{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
               font-size:12px;color:var(--muted)}

  .sechead{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 0 8px}
  .sechead .h{font-size:14px;font-weight:700}
  .sechead .r{font-size:11px;color:var(--muted)}

  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);
        border-radius:16px;padding:14px 15px;width:100%;text-align:left;min-height:44px}
  .ava{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
       justify-content:center;color:#fff;font-family:var(--display);font-size:15px;flex-shrink:0}
  .item .nm{font-size:14px;font-weight:700}
  .item .sb{font-size:11px;color:var(--muted)}
  .item .rt{text-align:right;margin-left:auto}
  .item .rt .v{font-size:14px;font-weight:700}
  .item .rt .p{font-size:12px;font-weight:700}
  .chev{color:var(--muted);flex-shrink:0}

  .tag{background:var(--tag);border-radius:20px;padding:3px 9px;font-size:11px;
       color:var(--muted);white-space:nowrap}
  .tag.out{background:var(--bg);border:1px solid rgba(33,26,46,0.1)}
  .badge{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .badge.pending{background:var(--ink);color:var(--bg)}
  .badge.applying,.badge.done{background:var(--tag);color:var(--ink)}
  .badge.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--up)}

  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
          border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
  .tabbar .inner{max-width:480px;margin:0 auto;display:flex}
  .tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;
                 align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px}
  .tabbar button.on{color:var(--ink);font-weight:700}

  .panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);
         border-top:1px solid var(--line);z-index:30;
         padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px))}
  .panel .inner{max-width:480px;margin:0 auto}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
  .seg button{flex:1;border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on-buy{background:var(--point);color:var(--ink)}
  .seg button.on-sell{background:var(--ink);color:var(--bg)}
  .step{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
        display:flex;align-items:center;justify-content:center}
  .qty{width:64px;text-align:center;font-size:15px;font-weight:700;border:none;
       outline:none;background:transparent;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--bg);color:var(--muted);border-radius:20px;padding:7px 12px;
        font-size:12px;display:flex;align-items:center;gap:4px}
  .chip.on{background:var(--ink);color:var(--bg);font-weight:700}
  .chips.ask .chip{box-shadow:inset 0 0 0 1px rgba(242,169,59,.7)}
  .chips.flash .chip{animation:ask .45s ease-in-out 2}
  @keyframes ask{50%{box-shadow:inset 0 0 0 2px var(--point);background:#FDF3E2}}
  @media (prefers-reduced-motion:reduce){.chips.flash .chip{animation:none;
    box-shadow:inset 0 0 0 2px var(--point)}}
  .cta.ghost{background:var(--tag);color:var(--muted)}
  .cta{width:100%;border-radius:14px;padding:15px 0;font-size:15px;font-weight:700;
       background:var(--ink);color:var(--bg);margin-top:12px}
  .cta.sell{background:var(--up);color:#fff}
  .cta:disabled{opacity:.45}

  .seg2{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
  .seg2 button{flex:1;border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
  .seg2 button.on{background:var(--card);color:var(--ink)}

  .rankrow{display:flex;align-items:center;gap:12px;background:var(--card);
           border-radius:16px;padding:13px 15px}
  .rankrow.me{background:var(--ink);color:var(--bg)}
  .rankrow .no{font-family:var(--display);font-size:17px;width:26px;text-align:center}

  .news{background:var(--card);border-radius:16px;padding:16px;display:flex;
        flex-direction:column;gap:9px}
  .news.sp{border:1px solid var(--warn-line)}
  .news .hd{font-size:15px;font-weight:700;line-height:1.4}
  .speaker{width:26px;height:26px;border-radius:8px;background:var(--point);
           display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .speaker.warn{background:var(--warn-bg)}

  .bar{height:6px;border-radius:3px;background:var(--tag);margin-top:5px;
       position:relative;overflow:hidden}
  .bar i{position:absolute;left:50%;top:0;bottom:0;display:block}

  .kv{display:flex;align-items:center;justify-content:space-between;padding:9px 0;
      border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv .k{font-size:12px;color:var(--muted)}
  .kv .v{font-size:13px;font-weight:700}

  .metric{background:var(--bg);border-radius:12px;padding:10px 8px}
  .metric .k{font-size:11px;color:var(--muted)}
  .metric .v{font-size:14px;font-weight:700;margin-top:2px}

  .speed{display:flex;gap:6px;flex-wrap:wrap}
  .speed button{background:var(--card);border:1px solid var(--line);border-radius:10px;
                padding:8px 12px;font-size:12px;color:var(--muted)}
  .speed button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

  /* 아래쪽에 띄우면 주문 패널과 근거 칩을 가린다. 안내가 가리키는 것을 덮으면 안 된다. */
  .toast{position:fixed;left:50%;transform:translateX(-50%);
         top:calc(12px + env(safe-area-inset-top,0px));
         background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;
         font-size:12px;font-weight:700;z-index:50;max-width:calc(100% - 40px);text-align:center;
         box-shadow:0 4px 18px rgba(33,26,46,.18)}

        color:var(--muted);line-height:1.6}
  canvas{display:block;width:100%;max-width:100%}
  @media (prefers-reduced-motion:no-preference){
    .fade{animation:fadeUp .22s ease-out both}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  :focus-visible{outline:2px solid var(--point);outline-offset:2px}
</style>

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gaussFactory(rnd){
  let spare = null;
  return function(sigma){
    if (spare !== null){ const v = spare; spare = null; return v * sigma; }
    let u, v, s;
    do { u = rnd() * 2 - 1; v = rnd() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m;
    return u * m * sigma;
  };
}

/* 목표값 램프 보간. 구간이 바뀌는 지점에서 계단 점프가 생기지 않는다. */
function buildTargets(segments, total, initial){
  const out = new Array(total + 1).fill(initial);
  let anchor = initial;
  for (const seg of segments){
    const span = seg.to - seg.from;
    for (let t = seg.from + 1; t <= Math.min(seg.to, total); t++){
      out[t] = anchor + (seg.target - anchor) * ((t - seg.from) / span);
    }
    anchor = seg.target;
  }
  return out;
}
function buildDrift(stock, total){
  const a = new Array(total + 1).fill(0);
  for (const s of (stock.drift_segments || [])){
    for (let t = s.from + 1; t <= s.to; t++) a[t] = s.drift;
  }
  return a;
}
function decayWeights(n){
  const tau = Math.max(1, n / 2); const raw = []; let sum = 0;
  for (let k = 0; k < n; k++){ const w = Math.exp(-k / tau); raw.push(w); sum += w; }
  return raw.map(w => w / sum);
}
function rampWeights(n){
  const raw = []; let sum = 0;
  for (let k = 0; k < n; k++){ raw.push(k + 1); sum += k + 1; }
  return raw.map(w => w / sum);
}

/* 이벤트를 틱별 delta 로 미리 전개한다. 펌프 총합 < 덤프 총합과
   복리 순효과 손실을 여기서 강제한다. */
function buildEvents(sc, rnd){
  const P = sc.params;
  const bySector = {};
  for (const s of sc.stocks){ (bySector[s.sector] = bySector[s.sector] || []).push(s.symbol); }
  const byTick = new Map();
  const events = [];
  const add = (tick, symbol, d) => {
    if (!byTick.has(tick)) byTick.set(tick, {});
    const b = byTick.get(tick);
    b[symbol] = (b[symbol] || 0) + d;
  };

  for (const e of sc.events){
    const delay = e.impact_delay_ticks || 0;
    if (e.type === 'short_pressure'){
      let pump = e.pump.min + rnd() * (e.pump.max - e.pump.min);
      pump = Math.max(pump, P.min_visible_pump - 1);
      let dump = e.dump.min + rnd() * (e.dump.max - e.dump.min);
      dump = Math.max(dump, pump * (1 + P.net_loss_margin));
      const pw = rampWeights(e.pump.ticks);
      let dw = decayWeights(e.dump.ticks);
      let pd = pw.map(w => pump * w);
      let dd = dw.map(w => -dump * w);
      for (let i = 0; i < 200; i++){
        let m = 1;
        for (const d of pd.concat(dd)) m *= 1 + d;
        if (m < 1) break;
        dump *= 1.02;
        dd = dw.map(w => -dump * w);
      }
      const start = e.tick + delay;
      const deltas = pd.concat(dd);
      deltas.forEach((d, i) => add(start + i, e.symbol, d));
      events.push({
        key: e.key, type: 'short_pressure', headline: e.headline,
        body: '공매도 집중으로 위험하지만, 일시적으로 오를 수 있습니다',
        badge: '공매도 집중 과열 · 급등 후 급락 위험',
        tick: e.tick, symbol: e.symbol, sector: null, difficulty: null,
        start, end: start + deltas.length - 1,
        pumpTicks: e.pump.ticks, pumpTotal: pump, dumpTotal: dump,
        pumpStart: start, pumpEnd: start + e.pump.ticks - 1,
      });
    } else {
      const spread = e.spread_ticks || 6;
      const targets = e.symbol ? [e.symbol] : (bySector[e.sector] || []);
      const w = decayWeights(spread);
      const start = e.tick + delay;
      for (let i = 0; i < spread; i++){
        for (const sym of targets) add(start + i, sym, e.delta * w[i]);
      }
      events.push({
        key: e.key, type: 'normal', headline: e.headline || '', body: e.body || '',
        tick: e.tick, symbol: e.symbol || null, sector: e.sector || null,
        difficulty: e.difficulty, start, end: start + spread - 1,
      });
    }
  }
  events.sort((a, b) => a.tick - b.tick);
  return { byTick, events };
}

/* 틱당 가격. 방향은 절대 뒤집히지 않고, 변동폭만 깎인다. */
function computeTick(inp){
  if (!inp.liquidity) throw new Error('유동성이 0 이면 계산할 수 없다');
  const base = inp.drift + inp.noise;
  const fear = -inp.beta * inp.fearSens * (inp.fearChange / 100);
  const fx = inp.fxExposure * inp.fxSens * inp.fxChange;
  const total = base + inp.eventDelta + fear + fx;
  let f = (inp.buyQty - inp.sellQty) / inp.liquidity;
  f = Math.max(-1, Math.min(1, f));
  const damp = Math.min(inp.resistance * Math.abs(f), inp.cap);
  const actual = total * (1 - damp);
  const price = Math.max(Math.round(inp.prev * (1 + actual)), inp.minPrice);
  return { base, fear, fx, total, f, damp, actual, price };
}

/* ===================== 게임 ===================== */

const REASONS = ['실적성장','저평가','차트추세','분산','뉴스','직감'];
const BOT_KINDS = ['momentum','contrarian','random','buy_and_hold','news_reactive'];
const BOT_REASON = {momentum:'차트추세',contrarian:'저평가',random:'직감',
                    buy_and_hold:'분산',news_reactive:'뉴스'};
const BOT_NAMES = ['별하','도현','서윤','지후','하람','예린','太민','유나','건우','채원',
                   '시온','나윤','주안','다온','은결','해찬','린아','소율'];
const BEHAVIOR_LABEL = {momentum:'모멘텀추종',contrarian:'역추세',news:'뉴스반응',
                        hold:'매수후보유',mixed:'혼합'};

function makeAccount(cash){
  return { cash, reserved: 0, holdings: {}, avgCost: {}, reservedQty: {},
           buys: [], trades: [] };
}
function assetOf(acc, prices){
  let v = acc.cash + acc.reserved;
  for (const s in acc.holdings) v += acc.holdings[s] * prices[s];
  return v;
}

function createGame(sc, seed, nickname){
  const rnd = mulberry32(seed);
  const gauss = gaussFactory(rnd);
  const total = sc.total_ticks;
  const P = sc.params;

  const symbols = sc.stocks.map(s => s.symbol);
  const stockBy = {}; sc.stocks.forEach(s => stockBy[s.symbol] = s);
  const prices = {}; const history = {};
  sc.stocks.forEach(s => { prices[s.symbol] = s.initial_price; history[s.symbol] = [s.initial_price]; });

  const drift = {}; sc.stocks.forEach(s => drift[s.symbol] = buildDrift(s, total));
  const fearTargets = buildTargets(sc.fear_index.segments, total, sc.fear_index.initial);
  const fxTargets = buildTargets(sc.fx_rate.segments, total, sc.fx_rate.initial);
  const { byTick, events } = buildEvents(sc, mulberry32(seed));

  const player = makeAccount(sc.starting_cash);
  player.name = nickname;
  const bots = [];
  const botRnd = mulberry32(seed + 7);
  for (let i = 0; i < 15; i++){
    const b = makeAccount(sc.starting_cash);
    b.name = BOT_NAMES[i % BOT_NAMES.length];
    b.kind = BOT_KINDS[i % BOT_KINDS.length];
    b.rnd = mulberry32(Math.floor(botRnd() * 1e9));
    b.seeded = false;
    bots.push(b);
  }

  return {
    sc, seed, total, P, symbols, stockBy, prices, history, drift,
    fearTargets, fxTargets, byTick, events,
    tick: 0, fear: [sc.fear_index.initial], fx: [sc.fx_rate.initial],
    gauss, rnd, player, bots, queued: [], pending: [],
    news: [], badges: {}, rank: [], flow: {},
    disp: { fear: 0, fx: 0 },
    stats: { prev: sc.starting_cash, peak: sc.starting_cash, n: 0, mean: 0, m2: 0, mdd: 0 },
    contrib: { base: 0, event: 0, fear: 0, fx: 0 },
    lots: {}, buys: [], sells: [], orderLog: [],
    windowBuys: [], crowd: [],
    ended: false,
  };
}

function pushStat(st, asset){
  if (st.prev > 0){
    const r = asset / st.prev - 1;
    st.n += 1;
    const d = r - st.mean;
    st.mean += d / st.n;
    st.m2 += d * (r - st.mean);
  }
  st.prev = asset;
  if (asset > st.peak) st.peak = asset;
  else if (st.peak > 0) st.mdd = Math.max(st.mdd, 1 - asset / st.peak);
}
function riskScore(st){
  if (st.n < 2) return 0;
  const sd = Math.sqrt(st.m2 / st.n);
  return sd === 0 ? 0 : st.mean / sd;
}

function maxBuyable(G, acc, symbol){
  const p = G.prices[symbol];
  const byCash = Math.floor(acc.cash / (p * (1 + G.P.fee_rate)));
  const held = (acc.holdings[symbol] || 0) * p;
  const room = Math.floor(assetOf(acc, G.prices) * G.P.max_position_ratio) - held;
  return Math.max(0, Math.min(byCash, Math.max(0, Math.floor(room / p))));
}

function submit(G, acc, symbol, side, qty, reason){
  if (G.ended) return { ok: false, msg: '이미 끝난 판입니다' };
  if (G.tick >= G.total) return { ok: false, msg: '마지막 틱이라 체결될 수 없습니다' };
  qty = Math.floor(qty);
  if (!(qty > 0)) return { ok: false, msg: '수량은 1 이상이어야 합니다' };
  const p = G.prices[symbol];
  if (side === 'buy'){
    if (!reason) return { ok: false, msg: '매수 근거를 하나 골라야 합니다' };
    const need = Math.ceil(p * qty * (1 + G.P.fee_rate));
    if (need > acc.cash) return { ok: false, msg: '현금이 부족합니다' };
    const held = (acc.holdings[symbol] || 0) * p;
    const room = Math.floor(assetOf(acc, G.prices) * G.P.max_position_ratio) - held;
    if (p * qty > Math.max(0, room)) return { ok: false, msg: '한 종목에 총자산의 50% 까지만 담을 수 있습니다' };
    acc.cash -= need; acc.reserved += need;
    G.queued.push({ acc, symbol, side, qty, reason, reserved: need, tick: G.tick });
  } else {
    const free = (acc.holdings[symbol] || 0) - (acc.reservedQty[symbol] || 0);
    if (qty > free) return { ok: false, msg: '보유 수량이 부족합니다' };
    acc.reservedQty[symbol] = (acc.reservedQty[symbol] || 0) + qty;
    G.queued.push({ acc, symbol, side, qty, reason: null, reserved: 0, tick: G.tick });
  }
  return { ok: true, msg: `${qty.toLocaleString('ko-KR')}주 주문 접수. 다음 틱 가격으로 체결됩니다` };
}

function fill(G, o){
  const acc = o.acc, p = G.prices[o.symbol], fee = G.P.fee_rate;
  if (o.side === 'buy'){
    acc.reserved -= o.reserved; acc.cash += o.reserved;
    const byCash = Math.floor(acc.cash / (p * (1 + fee)));
    const held = (acc.holdings[o.symbol] || 0) * p;
    const room = Math.floor(assetOf(acc, G.prices) * G.P.max_position_ratio) - held;
    const byRoom = Math.max(0, Math.floor(room / p));
    const qty = Math.min(o.qty, byCash, byRoom);
    if (qty <= 0) return 0;
    const gross = p * qty, f = Math.round(gross * fee);
    acc.cash -= gross + f;
    const prevQ = acc.holdings[o.symbol] || 0;
    const prevC = (acc.avgCost[o.symbol] || 0) * prevQ;
    acc.holdings[o.symbol] = prevQ + qty;
    acc.avgCost[o.symbol] = (prevC + gross + f) / (prevQ + qty);
    acc.buys.push({ symbol: o.symbol, tick: o.tick, reason: o.reason, qty, price: p });
    acc.trades.push({ side: 'buy', symbol: o.symbol, qty, price: p, tick: G.tick, reason: o.reason });
    if (acc === G.player){
      (G.lots[o.symbol] = G.lots[o.symbol] || []).push({ qty, price: p, reason: o.reason });
      G.buys = acc.buys; G.orderLog = acc.trades;
    }
    // 군중이 무엇을 사고 있는지 집계한다
    G.windowBuys.push({ acc, symbol: o.symbol, value: qty * p });
    return qty;
  }
  acc.reservedQty[o.symbol] = Math.max(0, (acc.reservedQty[o.symbol] || 0) - o.qty);
  const qty = Math.min(o.qty, acc.holdings[o.symbol] || 0);
  if (qty <= 0) return 0;
  const gross = p * qty, f = Math.round(gross * fee);
  acc.cash += gross - f;
  acc.holdings[o.symbol] -= qty;
  if (acc.holdings[o.symbol] === 0){ delete acc.holdings[o.symbol]; delete acc.avgCost[o.symbol]; }
  acc.trades.push({ side: 'sell', symbol: o.symbol, qty, price: p, tick: G.tick });
  if (acc === G.player){
    let rest = qty;
    const q = G.lots[o.symbol] || [];
    while (rest > 0 && q.length){
      const lot = q[0];
      const take = Math.min(rest, lot.qty);
      G.sells.push({ reason: lot.reason, qty: take, buy: lot.price, exit: p });
      lot.qty -= take; rest -= take;
      if (lot.qty === 0) q.shift();
    }
    G.orderLog = acc.trades;
  }
  return qty;
}

function windowReturn(G, symbol, w){
  const h = G.history[symbol];
  if (h.length <= w) return 0;
  const past = h[h.length - 1 - w];
  return past ? h[h.length - 1] / past - 1 : 0;
}

function botAct(G, b){
  const r = b.rnd;
  const syms = G.symbols;
  const pick = (s, ratio) => {
    const p = G.prices[s];
    const qty = Math.min(Math.floor(b.cash * ratio / p), maxBuyable(G, b, s));
    if (qty > 0) submit(G, b, s, 'buy', qty, BOT_REASON[b.kind]);
  };
  const dump = (s, ratio) => {
    const free = (b.holdings[s] || 0) - (b.reservedQty[s] || 0);
    const qty = Math.floor(free * ratio);
    if (qty > 0) submit(G, b, s, 'sell', qty, null);
  };
  if (b.kind === 'momentum'){
    if (r() < 0.07){
      const best = syms.reduce((a, c) => windowReturn(G, c, 5) > windowReturn(G, a, 5) ? c : a, syms[0]);
      if (windowReturn(G, best, 5) > 0) pick(best, 0.32);
    }
    if (r() < 0.05){
      const held = Object.keys(b.holdings);
      if (held.length){
        const worst = held.reduce((a, c) => windowReturn(G, c, 5) < windowReturn(G, a, 5) ? c : a, held[0]);
        if (windowReturn(G, worst, 5) < -0.01) dump(worst, 0.5);
      }
    }
  } else if (b.kind === 'contrarian'){
    if (r() < 0.07){
      const worst = syms.reduce((a, c) => windowReturn(G, c, 5) < windowReturn(G, a, 5) ? c : a, syms[0]);
      if (windowReturn(G, worst, 5) < 0) pick(worst, 0.32);
    }
    if (r() < 0.05){
      const held = Object.keys(b.holdings);
      if (held.length){
        const best = held.reduce((a, c) => windowReturn(G, c, 5) > windowReturn(G, a, 5) ? c : a, held[0]);
        if (windowReturn(G, best, 5) > 0.02) dump(best, 0.5);
      }
    }
  } else if (b.kind === 'random'){
    if (r() < 0.09){
      const s = syms[Math.floor(r() * syms.length)];
      if (r() < 0.6) pick(s, 0.22); else dump(s, 0.5);
    }
  } else if (b.kind === 'buy_and_hold'){
    if (!b.seeded && G.tick >= 2 && G.tick <= 12 && r() < 0.6){
      const pool = syms.filter(s => !b.holdings[s]);
      if (pool.length) pick(pool[Math.floor(r() * pool.length)], 0.33);
      if (Object.keys(b.holdings).length >= 3) b.seeded = true;
    }
  } else if (b.kind === 'news_reactive'){
    const fresh = G.news[0];
    if (fresh && G.tick - fresh.tick <= 4 && r() < 0.38){
      const targets = fresh.symbol ? [fresh.symbol]
        : G.sc.stocks.filter(s => s.sector === fresh.sector).map(s => s.symbol);
      if (targets.length) pick(targets[Math.floor(r() * targets.length)], 0.35);
    }
  }
  // 경고 배지를 보고도 미끼를 무는 사람은 늘 있다
  const badged = Object.keys(G.badges);
  if (badged.length && r() < 0.1) pick(badged[Math.floor(r() * badged.length)], 0.25);
}

function step(G){
  if (G.ended || G.tick >= G.total) return;
  const sc = G.sc, P = G.P;
  G.tick += 1;
  const t = G.tick;
  G.pending = G.queued; G.queued = [];

  const fearPrev = G.fear[G.fear.length - 1];
  let fearNext = fearPrev + sc.fear_index.theta * (G.fearTargets[t] - fearPrev)
    + G.gauss(sc.fear_index.noise_sigma);
  fearNext = Math.max(0, Math.min(100, fearNext));
  G.fear.push(fearNext);
  const fxPrev = G.fx[G.fx.length - 1];
  const fxNext = fxPrev + sc.fx_rate.theta * (G.fxTargets[t] - fxPrev)
    + G.gauss(sc.fx_rate.noise_sigma);
  G.fx.push(fxNext);
  const fearChange = fearNext - fearPrev;
  const fxChange = (fxNext - fxPrev) / fxPrev;

  const buyQ = {}, sellQ = {};
  G.symbols.forEach(s => { buyQ[s] = 0; sellQ[s] = 0; });
  for (const o of G.pending){ (o.side === 'buy' ? buyQ : sellQ)[o.symbol] += o.qty; }

  const evd = G.byTick.get(t) || {};
  const results = {};
  for (const s of G.symbols){
    const st = G.stockBy[s];
    const prev = G.prices[s];
    const res = computeTick({
      prev, liquidity: st.liquidity, beta: st.beta, fxExposure: st.fx_exposure,
      drift: G.drift[s][t], noise: G.gauss(st.noise_sigma != null ? st.noise_sigma : P.noise_sigma),
      eventDelta: evd[s] || 0, fearChange, fxChange,
      buyQty: buyQ[s], sellQty: sellQ[s],
      resistance: P.resistance_coef, cap: P.dampening_cap,
      fearSens: P.fear_sensitivity, fxSens: P.fx_sensitivity, minPrice: P.min_price,
    });
    // 원인 분해: 이번 틱에 들고 있던 만큼만 기여로 잡는다
    const qty = G.player.holdings[s] || 0;
    if (qty){
      const basis = qty * prev, keep = 1 - res.damp;
      G.contrib.base  += basis * res.base * keep;
      G.contrib.event += basis * (evd[s] || 0) * keep;
      G.contrib.fear  += basis * res.fear * keep;
      G.contrib.fx    += basis * res.fx * keep;
    }
    G.prices[s] = res.price;
    G.history[s].push(res.price);
    results[s] = res;
  }

  for (const o of G.pending) fill(G, o);

  // 뉴스와 배지
  for (const e of G.events){
    if (e.tick === t && e.headline) G.news.unshift(e);
  }
  G.badges = {};
  for (const e of G.events){
    if (e.type === 'short_pressure' && t >= e.tick && t <= e.end){
      G.badges[e.symbol] = {
        label: e.badge,
        phase: t < e.start ? 'pending' : (t <= e.pumpEnd ? 'pump' : 'dump'),
      };
    }
  }

  for (const b of G.bots) botAct(G, b);
  pushStat(G.stats, assetOf(G.player, G.prices));
  for (const b of G.bots){
    b.stats = b.stats || { prev: b.cash, peak: b.cash, n: 0, mean: 0, m2: 0, mdd: 0 };
    pushStat(b.stats, assetOf(b, G.prices));
  }

  const iv = P.snapshot_interval_ticks;
  if (t % iv === 0 || t === 1){
    const anchor = Math.max(0, t - iv);
    G.disp = { fear: fearNext - G.fear[anchor], fx: fxNext - G.fx[anchor] };
    refreshRank(G);
    refreshFlow(G, buyQ, sellQ);
    detectCrowd(G, anchor, t);
  }
  if (t >= G.total){ G.ended = true; refreshRank(G); }
}

function refreshRank(G){
  const rows = [];
  const push = (acc, st, me) => {
    const a = assetOf(acc, G.prices);
    rows.push({ name: acc.name, asset: a, ret: a / G.sc.starting_cash - 1,
                risk: riskScore(st), mdd: st.mdd, me });
  };
  push(G.player, G.stats, true);
  for (const b of G.bots) push(b, b.stats || {n:0,mean:0,m2:0,mdd:0}, false);
  rows.sort((a, b) => b.ret - a.ret || a.mdd - b.mdd);
  rows.forEach((r, i) => r.rankReturn = i + 1);
  const byRisk = rows.slice().sort((a, b) => b.risk - a.risk || a.mdd - b.mdd);
  byRisk.forEach((r, i) => r.rankRisk = i + 1);
  const byTotal = rows.slice().sort(
    (a, b) => (a.rankReturn + a.rankRisk) / 2 - (b.rankReturn + b.rankRisk) / 2 || a.mdd - b.mdd);
  byTotal.forEach((r, i) => r.rankTotal = i + 1);
  G.rank = rows;
}

/* 한 종목에 매수가 몰린 구간을 찾는다. 결과 화면의 군중심리 비교에 쓴다. */
function detectCrowd(G, from, to){
  const rows = G.windowBuys;
  G.windowBuys = [];
  if (!rows.length) return;
  const byS = {}, who = {};
  let grand = 0;
  for (const r of rows){
    byS[r.symbol] = (byS[r.symbol] || 0) + r.value;
    (who[r.symbol] = who[r.symbol] || new Set()).add(r.acc);
    grand += r.value;
  }
  const top = Object.keys(byS).reduce((a, c) => byS[c] > byS[a] ? c : a, Object.keys(byS)[0]);
  if (!grand || byS[top] / grand < 0.6) return;
  if (who[top].size < 3) return;
  G.crowd.push({ from, to, symbol: top, share: byS[top] / grand, followers: who[top] });
}

function refreshFlow(G, buyQ, sellQ){
  const flow = {};
  for (const s of G.symbols){
    flow[s] = { net: (buyQ[s] || 0) - (sellQ[s] || 0) };
  }
  G.flow = flow;
}

const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (v) => Math.round(Number(v) || 0).toLocaleString('ko-KR');
const pct = (v, d = 1) => {
  const n = (Number(v) || 0) * 100;
  const r = Number(n.toFixed(d));
  if (r === 0) return (0).toFixed(d) + '%';
  return (r > 0 ? '+' : '') + r.toFixed(d) + '%';
};
const signedWon = (v) => {
  const n = Math.round(Number(v) || 0);
  const m = n > 0 ? '▲ ' : n < 0 ? '▼ ' : '';
  return m + Math.abs(n).toLocaleString('ko-KR') + '원';
};
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
const clock = (sec) => {
  const s = Math.max(0, Math.floor(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
const arrow = (v) => {
  const n = Math.round(v);
  if (n === 0) return '―';
  return (n > 0 ? '▲' : '▼') + Math.abs(n);
};
/* 한국어 조사. 받침 유무로 을/를, 이/가 를 고른다. */
const josa = (word, withBatchim, without) => {
  const last = String(word).trim().slice(-1);
  const code = last.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return without;
  return (code - 0xAC00) % 28 ? withBatchim : without;
};

function toast(msg){
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2200);
}

function donutHTML(slices, total){
  const size = 86, r = size/2 - 7, C = 2*Math.PI*r;
  let off = 0;
  const arcs = slices.map(s => {
    const dash = (total ? s.value/total : 0) * C;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}"
      stroke-width="13" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}"/>`;
    off += dash; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    style="transform:rotate(-90deg);flex-shrink:0" aria-hidden="true">${arcs}</svg>`;
}

function drawChart(data, rising){
  const cv = document.getElementById('chart');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 168;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const pts = data.slice(-90);
  if (pts.length < 2) return;
  const min = Math.min(...pts), max = Math.max(...pts);
  const pad = (max - min) * 0.12 || 1;
  const lo = min - pad, hi = max + pad;
  const padR = 52, padY = 10;
  const X = i => (i / (pts.length - 1)) * (w - padR - 8) + 4;
  const Y = v => padY + (1 - (v - lo) / (hi - lo)) * (h - padY * 2);
  const color = rising ? '#C13B3B' : '#3457B2';

  ctx.strokeStyle = 'rgba(33,26,46,0.08)';
  ctx.lineWidth = 1;
  ctx.font = '10px "Noto Sans KR", sans-serif';
  ctx.fillStyle = '#5C5548';
  ctx.textAlign = 'left';
  for (let k = 0; k <= 3; k++){
    const v = lo + (hi - lo) * (k / 3), y = Y(v);
    ctx.beginPath(); ctx.moveTo(4, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(Math.round(v).toLocaleString('ko-KR'), w - padR + 6, y + 3);
  }
  const grad = ctx.createLinearGradient(0, padY, 0, h - padY);
  grad.addColorStop(0, color + '38'); grad.addColorStop(1, color + '00');
  ctx.beginPath();
  ctx.moveTo(X(0), Y(pts[0]));
  pts.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(pts.length - 1), h - padY); ctx.lineTo(X(0), h - padY); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  pts.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath();
  ctx.arc(X(pts.length - 1), Y(pts[pts.length - 1]), 3.5, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

const FACTOR = { base:'종목 자체 흐름', event:'뉴스 이벤트', fear:'공포지수', fx:'환율' };
const PAIRING = { 차트추세:'momentum', 저평가:'contrarian', 뉴스:'news', 분산:'hold',
                  실적성장:'mixed', 직감:'mixed' };

function allAccounts(){ return [G.player].concat(G.bots); }
function retOf(acc){ return assetOf(acc, G.prices) / G.sc.starting_cash - 1; }

/* 행동 기반 성향. 서버판 analysis.classify_behavior 와 같은 기준을 쓴다. */
function classifyBehavior(acc){
  const buys = acc.buys || [];
  if (!buys.length) return { type:'mixed', label:BEHAVIOR_LABEL.mixed, votes:{} };
  const headlineTicks = G.events.filter(e => e.headline).map(e => e.tick);
  const votes = { momentum:0, contrarian:0, news:0 };
  for (const b of buys){
    if (headlineTicks.some(h => b.tick - h >= 0 && b.tick - h <= 4)){ votes.news++; continue; }
    const h = G.history[b.symbol];
    const idx = Math.min(b.tick, h.length - 1);
    const past = h[Math.max(0, idx - 5)];
    const trend = past ? h[idx]/past - 1 : 0;
    if (trend > 0.004) votes.momentum++;
    else if (trend < -0.004) votes.contrarian++;
  }
  const trades = acc.trades || [];
  const earlyCut = G.total * 0.35;
  if (trades.length <= 10 && trades.every(o => o.tick <= earlyCut))
    return { type:'hold', label:BEHAVIOR_LABEL.hold, votes };
  const sum = votes.momentum + votes.contrarian + votes.news;
  let kind = 'mixed';
  if (sum){
    kind = Object.keys(votes).reduce((a,c) => votes[c] > votes[a] ? c : a, 'momentum');
    if (votes[kind] / sum < 0.55) kind = 'mixed';
  }
  return { type:kind, label:BEHAVIOR_LABEL[kind], votes };
}

function reasonReport(){
  const open = [];
  for (const s in G.lots){
    for (const lot of G.lots[s]){
      if (lot.qty > 0) open.push({ reason: lot.reason, qty: lot.qty, buy: lot.price, exit: G.prices[s] });
    }
  }
  const by = {};
  for (const o of G.sells.concat(open)){
    const k = o.reason || '미기재';
    by[k] = by[k] || { reason:k, count:0, invested:0, profit:0, closed:0 };
    by[k].count += 1;
    by[k].invested += o.qty * o.buy;
    by[k].profit += o.qty * (o.exit - o.buy);
  }
  return Object.values(by)
    .map(r => ({ ...r, avg: r.invested ? r.profit / r.invested : 0 }))
    .sort((a,b) => b.count - a.count);
}

function typeAverages(){
  const by = {};
  for (const acc of allAccounts()){
    const k = classifyBehavior(acc).type;
    (by[k] = by[k] || []).push(retOf(acc));
  }
  return Object.keys(by).map(k => ({
    type: k, label: BEHAVIOR_LABEL[k], count: by[k].length,
    avg: by[k].reduce((a,b) => a+b, 0) / by[k].length,
  })).sort((a,b) => b.avg - a.avg);
}

const CROWD_SHOW = 4;

function crowdReport(){
  return G.crowd.map(m => {
    const foll = [], others = [];
    for (const acc of allAccounts()){
      (m.followers.has(acc) ? foll : others).push(retOf(acc));
    }
    const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : 0;
    return {
      symbol: m.symbol, name: G.stockBy[m.symbol].name,
      from: m.from, to: m.to, count: foll.length,
      follower: avg(foll), other: avg(others),
      iFollowed: m.followers.has(G.player),
    };
  });
}

/* 쏠림 구간이 열 개 넘게 잡히면 화면이 벽이 된다.
   참여자가 많았던 순으로 몇 개만 보여 주고 나머지는 숫자로 요약한다. */
function topCrowd(rows){
  return rows.slice()
    .sort((a, b) => (b.iFollowed ? 1 : 0) - (a.iFollowed ? 1 : 0) || b.count - a.count)
    .slice(0, CROWD_SHOW);
}

function shortReport(){
  return G.events.filter(e => e.type === 'short_pressure').map(e => {
    const h = G.history[e.symbol];
    const at = i => h[Math.min(Math.max(i,0), h.length-1)];
    const log = G.player.trades;
    const bought = log.some(o => o.side==='buy' && o.symbol===e.symbol
      && o.tick>=e.pumpStart && o.tick<=e.pumpEnd+1);
    const sold = log.some(o => o.side==='sell' && o.symbol===e.symbol
      && o.tick>e.pumpEnd && o.tick<=e.end+1);
    const entrants = G.bots.filter(b => (b.trades||[]).some(o =>
      o.side==='buy' && o.symbol===e.symbol && o.tick>=e.pumpStart && o.tick<=e.pumpEnd+1));
    const escaped = entrants.filter(b => (b.trades||[]).some(o =>
      o.side==='sell' && o.symbol===e.symbol && o.tick>e.pumpEnd && o.tick<=e.end+1));
    return {
      headline: e.headline, symbol: e.symbol, name: G.stockBy[e.symbol].name,
      pump: at(e.pumpStart-1) ? at(e.pumpEnd)/at(e.pumpStart-1)-1 : 0,
      dump: at(e.pumpEnd) ? at(e.end)/at(e.pumpEnd)-1 : 0,
      bought, sold, entrants: entrants.length, escaped: escaped.length,
    };
  });
}

function bestRecord(ret){
  try {
    const raw = localStorage.getItem('moui.best');
    const prev = raw === null ? null : Number(raw);
    if (prev === null || ret > prev){ localStorage.setItem('moui.best', String(ret)); return { prev, isNew: prev !== null }; }
    return { prev, isNew: false };
  } catch (e) { return { prev: null, isNew: false }; }
}

        한 종목으로 몰린 구간이 ${crowd.length}번 있었습니다.
        그중 참여자가 많았던 ${CROWD_SHOW}개를 봅니다</div>` : ''}
      ${topCrowd(crowd).map(m => `
      <div class="kv" style="display:block">
        <div style="font-size:12px;font-weight:700">${esc(m.name)} 쏠림
          <span class="muted" style="font-weight:400">${m.count}명 참여</span>
          ${m.iFollowed?'<span class="tag" style="margin-left:4px">나도 샀음</span>':''}</div>
        <div class="row between" style="margin-top:5px">
          <span class="muted" style="font-size:11px">따라간 사람 평균</span>
          <span class="num ${cls(m.follower)}" style="font-size:12px;font-weight:700">${pct(m.follower)}</span></div>
        <div class="row between">
          <span class="muted" style="font-size:11px">안 따라간 사람 평균</span>
          <span class="num ${cls(m.other)}" style="font-size:12px;font-weight:700">${pct(m.other)}</span></div>
      </div>`).join('')}`
      : '<div class="muted" style="font-size:12px">이번 판에는 한 종목으로 뚜렷하게 몰린 구간이 없었습니다</div>'}</div>`)}

    ${shorts.length ? sec('공매도 집중 구간', `<div class="card">${shorts.map(s => `
      <div class="kv" style="display:block">
        <div style="font-size:12px;font-weight:700">${esc(s.headline)}</div>
        <div class="muted num" style="font-size:11px;margin-top:3px">
          펌프 ${pct(s.pump)} 뒤 덤프 ${pct(s.dump)}</div>
        <div style="font-size:12px;margin-top:6px;font-weight:700;color:${
          s.bought && !s.sold ? 'var(--up)' : 'var(--ink)'}">${
          s.bought ? (s.sold ? '펌프 구간에 샀지만 덤프 전에 빠져나왔습니다'
                             : '펌프 구간에 사서 덤프를 그대로 맞았습니다')
                   : '이 구간에는 사지 않았습니다'}</div>
        <div class="muted" style="font-size:11px;margin-top:3px">
          다른 참가자 ${s.entrants}명이 펌프 구간에 들어갔고 그중 ${s.escaped}명이 덤프 전에 나왔습니다</div>
      </div>`).join('')}</div>`) : ''}

    ${sec('내 주문 이력', `<div class="card">
      ${p.trades.length ? `<div style="max-height:280px;overflow-y:auto">
        ${p.trades.slice().reverse().map(o => `<div class="kv">
          <span><span style="font-size:12px;font-weight:700;color:${o.side==='buy'?'var(--up)':'var(--down)'}">
            ${o.side==='buy'?'매수':'매도'}</span>
            <span style="font-size:12px"> ${esc(G.stockBy[o.symbol].name)}</span><br>
            <span class="muted num" style="font-size:11px">${o.tick}틱${o.reason?' · '+esc(o.reason):''}</span></span>
          <span class="num" style="font-size:12px;font-weight:700">${o.qty}주 @ ${won(o.price)}</span>
        </div>`).join('')}</div>`
        : '<div class="muted" style="font-size:12px">주문 기록이 없습니다</div>'}
    </div>`)}

    <div class="note" style="margin-top:18px">
      경고 배지는 펌프 구간에도 계속 경고 톤을 유지합니다. 오르는 중이라고 안심시키면
      "지금 사도 되나"라는 잘못된 신호가 되어 교육 목적이 무너집니다.
    </div>
    <button id="again" class="cta" style="margin-top:18px">다시 하기</button>
  </div>`;
}
/* ---------- 라우팅과 입력 ---------- */

function render(){
  if (screen === 'start') return renderStart();
  if (screen === 'home') return renderHome();
  if (screen === 'market') return renderMarket();
  if (screen === 'news') return renderNews();
  if (screen === 'rank') return renderRank();
  if (screen === 'detail') return renderDetail();
  if (screen === 'result') return renderResult();
}

function goDetail(sym){
  detailSymbol = sym; screen = 'detail';
  side = 'buy'; qty = 1; reason = null;
  render();
}

function togglePause(){
  if (G.ended) return;
  paused = !paused;
  if (paused) clearInterval(timer); else startTimer();
  render();
}

app.addEventListener('click', (ev) => {
  const t = ev.target.closest(
    '[data-tab],[data-stock],[data-go],[data-rank],[data-sort],[data-side],[data-q],' +
    '[data-reason],#back,#order,#again,#maxBtn,#pause');
  if (!t) return;

  if (t.dataset.tab){ screen = t.dataset.tab; return render(); }
  if (t.dataset.go) return goDetail(t.dataset.go);
  if (t.dataset.stock) return goDetail(t.dataset.stock);
  if (t.dataset.rank){ rankTab = t.dataset.rank; return render(); }
  if (t.dataset.sort){ sortBy = t.dataset.sort; return render(); }
  if (t.id === 'back'){ screen = 'home'; return render(); }
  if (t.id === 'pause') return togglePause();
  if (t.id === 'again'){ clearInterval(timer); paused = false; screen = 'start'; return render(); }

  if (t.dataset.side){ side = t.dataset.side; qty = 1; reason = null; return render(); }
  if (t.dataset.q){ qty = Math.max(1, qty + Number(t.dataset.q)); return render(); }
  if (t.dataset.reason){ reason = t.dataset.reason; return render(); }

  if (t.id === 'maxBtn'){
    const m = side === 'buy'
      ? maxBuyable(G, G.player, detailSymbol)
      : (G.player.holdings[detailSymbol] || 0) - (G.player.reservedQty[detailSymbol] || 0);
    if (m > 0){ qty = m; render(); }
    return;
  }
  if (t.id === 'order'){
    // 근거를 안 고른 채로 눌렀을 때 조용히 아무 일도 없으면 고장으로 보인다.
    // 무엇이 빠졌는지 말해 주고 근거 줄을 잠깐 강조한다.
    if (side === 'buy' && !reason){
      toast('매수 근거를 하나 골라야 주문할 수 있습니다');
      askUntil = Date.now() + 900;
      setTimeout(() => { if (screen === 'detail') render(); }, 950);
      return render();
    }
    const res = submit(G, G.player, detailSymbol, side, qty, side === 'buy' ? reason : null);
    toast(res.msg);
    if (res.ok){ qty = 1; reason = null; }
    return render();
  }
});

app.addEventListener('input', (ev) => {
  if (ev.target.id === 'qty'){
    const n = parseInt(String(ev.target.value).replace(/\D/g, ''), 10);
    qty = Number.isFinite(n) && n > 0 ? n : 1;
  }
});

window.addEventListener('resize', () => {
  if (screen === 'detail' && G){
    const st = G.stockBy[detailSymbol];
    drawChart(G.history[detailSymbol], G.prices[detailSymbol] >= st.initial_price);
  }
});

render();
</script>
